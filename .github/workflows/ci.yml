name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Swift Testing 随 Xcode 16 提供；macOS 15 镜像默认使用 Xcode 16。
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: 显示 Swift 版本
        run: swift --version
      - name: 运行 Swift 测试
        run: swift test
      - name: 检查 Chrome 扩展脚本语法
        run: |
          node --check ChromeExtension/content.js
          node --check ChromeExtension/service-worker.js
